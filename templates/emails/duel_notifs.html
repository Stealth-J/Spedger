<div style="margin:0; padding:40px 20px; background:#f8f8f8; font-family:Arial, sans-serif; color:#222;">
    <div style="max-width:560px; margin:auto; background:#ffffff; border-radius:14px; overflow:hidden;">

        <div style="color:#fff; background:#ffa500; padding:18px 24px; font-size:22px; font-weight:bold;">
            SPEDGER
        </div>

        <div style="padding:36px 32px 40px;">
            <h2>{{ title }}</h2>

            <p>Hello {{ username }},</p>

            <p>{{ message }}</p>

            
            {% if score == 'none' %}
                <a href = "/users?tab=duels" style = "text-decoration: none; margin-top: 45px; display:flex; justify-content: end;">
                    Respond to request
                </a>
            {% else %}
                <div style="background:#fff7e8; border-left:4px solid #ffa500; padding:15px; margin:20px 0;">
                    Final Score: <strong>{{ score }}</strong>
                </div>

                <a href = "/users?tab=duels" style = "text-decoration: none; margin-top: 45px; display:flex; justify-content: end;">
                    See full stats
                </a>
            {% endif %}
        
        </div>

        <!-- Footer -->
        <div style="padding:20px 32px; border-top:1px solid #eeeeee; text-align:center;">
            <span style="font-size:13px; color:#999;">
                — The Spedger Team
            </span>
        </div>

    </div>
</div>
