<div style="margin:0; padding:40px 20px; background:#f8f8f8; font-family:Arial, sans-serif; color:#222;">
    <div style="max-width:560px; margin:auto; background:#ffffff; border-radius:14px; overflow:hidden;">

        <!-- Header -->
        <div style="color:#fff; background:#ffa500; padding:18px 24px; font-size:22px; font-weight:bold;">
            SPEDGER
        </div>

        <!-- Content -->
        <div style="padding:36px 32px 40px; text-align:center;">

            <div style="font-size:42px; margin-bottom:12px;">
                🎯
            </div>

            <h1 style="margin:0 0 30px; font-size:28px; line-height:1.2; color:#111;">
                Perfect slip, {{ username }}.
            </h1>

            <!-- 100% -->
            <div style="margin:0 auto 28px; padding:22px; background:#fff8eb; border-radius:12px;">
                <div style="font-size:42px; font-weight:800; color:#ffa500; line-height:1;">
                    100%
                </div>
                <div style="margin-top:7px; font-size:13px; color:#777;">
                    Perfect prediction
                </div>
            </div>

            <p style="margin:0; font-size:14px; color:#777;">
                Slip:
                <strong style="color:#333;">
                    {{ slip_code }}
                </strong> <br>
            </p>

        </div>

        <!-- Footer -->
        <div style="padding:20px 32px; border-top:1px solid #eeeeee; text-align:center;">
            <span style="font-size:13px; color:#999;">
                — The Spedger Team
            </span>
        </div>

    </div>
</div>
