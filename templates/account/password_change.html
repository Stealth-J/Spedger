{% extends "form_base.html" %}

{% block title %} Password Change {% endblock title %}

{% block form_content %}
  <div class="container mt-5">
    {% comment %} <h2><i class="bi bi-key-fill"></i> {% trans "Change Password" %}</h2> {% endcomment %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">
        {% comment %} <i class="bi bi-save2-fill"></i> {% trans "Save Changes" %} {% endcomment %}
      </button>
    </form>

    <p class="mt-3">
      <a href="{% url 'home' %}">
        {% comment %} <i class="bi bi-arrow-left-circle"></i> {% trans "Back to Settings" %} {% endcomment %}
      </a>
    </p>
  </div>
{% endblock %}
